name: DB store cache restore
description: Restore the GitFit database cache and snapshot baseline checksums before syncing.
author: Lax
branding:
  icon: database
  color: blue

inputs:
  db-dir:
    description: Path to the database directory (the directory containing the SQLite database).
    required: false
    default: data/db
  db-name:
    description: Database filename within db-dir. Must be a plain filename (no path separators).
    required: false
    default: git-fit.db
  git-restore-mode:
    description: >
      Whether and how to restore the database from a git branch when the cache
      does not provide it. 'none' (default) disables git restore; 'fallback'
      restores only when the database is missing/empty after the cache restore;
      'force' always restores from git, overwriting any cache-restored content.
    required: false
    default: 'none'
  git-branch:
    description: Archive branch to restore the database from. Only used when git-restore-mode is not 'none'.
    required: false
    default: GitFit/db

outputs:
  git-restored-bytes:
    description: Bytes restored from the git branch (0 when none or disabled).
    value: ${{ steps.git-restore.outputs.git-restored-bytes || '0' }}
  save-to-git-branch:
    description: >
      Branch to push the database back to after sync when the git restore
      succeeded; 'false' otherwise. Wire this into db-store/cache/save's
      'save-to-git-branch' input to persist the database to the git branch.
    value: ${{ steps.git-restore.outputs.save-to-git-branch || 'false' }}

runs:
  using: composite
  steps:
    - name: '[db] Validate inputs'
      shell: bash
      env:
        DB_DIR: ${{ inputs.db-dir }}
        DB_NAME: ${{ inputs.db-name }}
      run: |
        if [ -z "$DB_DIR" ] || [[ "$DB_DIR" =~ [[:cntrl:]] ]] || [[ "$DB_DIR" == -* ]]; then
          echo "::error::Invalid db-dir '$DB_DIR'" >&2
          exit 1
        fi
        if [ -z "$DB_NAME" ] || [[ "$DB_NAME" =~ [[:cntrl:]] ]] || [[ "$DB_NAME" == -* ]] \
           || [[ "$DB_NAME" == */* ]] || [ "$DB_NAME" = "." ] || [ "$DB_NAME" = ".." ]; then
          echo "::error::Invalid db-name '$DB_NAME' (plain filename, no path separators)" >&2
          exit 1
        fi
    - name: '[db] Normalize database directory'
      id: normalize
      shell: bash
      env:
        DB_DIR: ${{ inputs.db-dir }}
      run: |
        DB_DIR="$(realpath -m "$DB_DIR" || echo "$DB_DIR")"
        case "$DB_DIR" in
          "$GITHUB_WORKSPACE"/*) REL_DIR="${DB_DIR#"$GITHUB_WORKSPACE"/}" ;;
          "$GITHUB_WORKSPACE")   REL_DIR="." ;;
          *)                     REL_DIR="$DB_DIR" ;;
        esac
        echo "db-dir=$REL_DIR" >> "$GITHUB_OUTPUT"
    - name: '[db] Validate git restore inputs'
      shell: bash
      env:
        GIT_RESTORE_MODE: ${{ inputs.git-restore-mode }}
        GIT_BRANCH: ${{ inputs.git-branch }}
      run: |
        if [ "$GIT_RESTORE_MODE" != "none" ] && [ "$GIT_RESTORE_MODE" != "fallback" ] && [ "$GIT_RESTORE_MODE" != "force" ]; then
          echo "::error::Invalid git-restore-mode '$GIT_RESTORE_MODE' (expected none|fallback|force)" >&2
          exit 1
        fi
        if [ "$GIT_RESTORE_MODE" != "none" ]; then
          if [ -n "$GIT_BRANCH" ] && ( [[ "$GIT_BRANCH" =~ [[:cntrl:]] ]] || [[ "$GIT_BRANCH" == -* ]] ); then
            echo "::error::Invalid git-branch '$GIT_BRANCH'" >&2
            exit 1
          fi
        fi
    - name: '[db] Restore from cache'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.normalize.outputs.db-dir }}
        # exact key: sentinel — never written by any save; forces prefix fallback to the most recent cache.
        key: GitFit-db-v0-sentinel
        # prefix match: hits the most recently created cache sharing the -v0- prefix,
        # including per-run -v0-{run} sync caches and -v0-snapshot recovery caches from unarchive.
        restore-keys: |
          GitFit-db-v0-
    - name: '[db] Restore from git branch'
      id: git-restore
      if: ${{ inputs.git-restore-mode != 'none' }}
      shell: bash
      env:
        DB_DIR: ${{ steps.normalize.outputs.db-dir }}
        DB_NAME: ${{ inputs.db-name }}
        GIT_RESTORE_MODE: ${{ inputs.git-restore-mode }}
        GIT_BRANCH: ${{ inputs.git-branch }}
      run: |
        set -euo pipefail
        DB_PATH="$DB_DIR/$DB_NAME"
        BRANCH="${GIT_BRANCH:-GitFit/db}"
        if [ "$GIT_RESTORE_MODE" = "fallback" ] && [ -s "$DB_PATH" ]; then
          echo "git-restored-bytes=0" >> "$GITHUB_OUTPUT"
          echo "save-to-git-branch=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "Cache miss / force — restoring DB from branch '$BRANCH'"
        git fetch origin "$BRANCH" || true
        RESTORED=0
        if git archive --format=tar "origin/$BRANCH" "$DB_DIR/" 2>/dev/null | tar xf -; then
          RESTORED="$(stat -c%s "$DB_PATH" 2>/dev/null || echo 0)"
        fi
        echo "git-restored-bytes=$RESTORED" >> "$GITHUB_OUTPUT"
        if [ "$RESTORED" -gt 0 ]; then
          echo "save-to-git-branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Restored DB from branch '$BRANCH': $RESTORED bytes"
        else
          echo "save-to-git-branch=false" >> "$GITHUB_OUTPUT"
          if [ "$GIT_RESTORE_MODE" = "force" ]; then
            echo "::warning::Force git restore failed — keeping cache-restored DB"
          else
            echo "Branch restore failed — DB will be created fresh by sync"
          fi
        fi
    - name: '[db] Baseline SHA256SUMS'
      shell: bash
      env:
        DB_DIR: ${{ steps.normalize.outputs.db-dir }}
      run: |
        if [ -d "$DB_DIR" ]; then
          (cd "$DB_DIR" && find . -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/git-fit-db-before.SHA256SUMS")
        else
          : > "$RUNNER_TEMP/git-fit-db-before.SHA256SUMS"
        fi
    - name: '[db] Write restore summary'
      shell: bash
      env:
        DB_DIR: ${{ steps.normalize.outputs.db-dir }}
        DB_NAME: ${{ inputs.db-name }}
        GIT_RESTORED_BYTES: ${{ steps.git-restore.outputs.git-restored-bytes || '0' }}
        SAVE_TO_GIT_BRANCH: ${{ steps.git-restore.outputs.save-to-git-branch || 'false' }}
      run: |
        DB_PATH="$DB_DIR/$DB_NAME"
        if [ -s "$DB_PATH" ]; then
          SIZE="$(stat -c%s "$DB_PATH")"
          DB_FILE="present ($SIZE bytes)"
          if [ "$GIT_RESTORED_BYTES" -gt 0 ]; then
            RESTORE_SOURCE="git"
          else
            RESTORE_SOURCE="cache"
          fi
        else
          DB_FILE="missing"
          RESTORE_SOURCE="none (fresh)"
        fi
        {
          echo "### GitFit db-store restore"
          echo ""
          echo "| Item | Value |"
          echo "|---|---|"
          echo "| DB path | $DB_PATH |"
          echo "| DB file | $DB_FILE |"
          echo "| Restore source | $RESTORE_SOURCE |"
          echo "| Git restore (bytes) | $GIT_RESTORED_BYTES |"
          echo "| save-to-git-branch | $SAVE_TO_GIT_BRANCH |"
        } >> "$GITHUB_STEP_SUMMARY"
