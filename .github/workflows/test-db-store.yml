name: Test db-store

on:
  push:
    branches: [master]

permissions:
  contents: read
  actions: write

# Test isolation invariant — the GitFit-db-v0- cache is SHARED across all jobs
# and persists between runs (~7d LRU). To keep tests deterministic:
#   * Every job that saves to cache writes the canonical db-dir data/db and the
#     canonical db-name git-fit.db (see db-smoke and db-save-git-unchanged).
#   * Any other db-dir + db-name combination is guaranteed absent from the
#     cache: no past or future test save writes a different dir/name, so a
#     restore can never populate it. db-git-restore-fallback relies on this to
#     deterministically simulate a cache miss (fixture created at test time on a
#     fake local origin, path absent from the cache).
#   * Do NOT add test saves of other dir/name combinations — that reintroduces
#     cross-job pollution and breaks the invariant.

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  db-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Derive paths (relative)
        id: rel
        uses: ./paths
        with:
          database-path: data/db/workouts.db
      - name: Assert relative outputs
        run: |
          test "${{ steps.rel.outputs.dir }}" = "data/db"
          test "${{ steps.rel.outputs.name }}" = "workouts.db"
          test "${{ steps.rel.outputs.db-path }}" = "data/db/workouts.db"
      - name: Derive paths (.. normalization via realpath)
        id: norm
        uses: ./paths
        with:
          database-path: data/foo/../db/git-fit.db
      - name: Assert normalized to canonical path
        run: |
          test "${{ steps.norm.outputs.dir }}" = "data/db"
          test "${{ steps.norm.outputs.name }}" = "git-fit.db"
          test "${{ steps.norm.outputs.db-path }}" = "data/db/git-fit.db"
      - name: Derive paths (absolute under workspace strips to relative)
        id: abs
        uses: ./paths
        with:
          database-path: ${{ github.workspace }}/data/db/git-fit.db
      - name: Assert workspace prefix stripped
        run: |
          test "${{ steps.abs.outputs.dir }}" = "data/db"
          test "${{ steps.abs.outputs.name }}" = "git-fit.db"
          test "${{ steps.abs.outputs.db-path }}" = "data/db/git-fit.db"
      - name: Invalid database-path must fail
        id: invalid
        continue-on-error: true
        uses: ./paths
        with:
          database-path: '-bad'
      - name: Assert invalid failed
        run: test "${{ steps.invalid.outcome }}" = "failure"

  db-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create test db
        run: |
          mkdir -p data/db
          printf 'hello\n' > data/db/git-fit.db
      - name: Save to cache (first run)
        id: save1
        uses: ./cache/save
        with:
          db-dir: data/db
          db-name: git-fit.db
      - name: Assert changed=true
        run: test "${{ steps.save1.outputs.changed }}" = "true"
      - name: Restore from cache
        id: restore
        uses: ./cache/restore
        with:
          db-dir: data/db
          db-name: git-fit.db
      - name: Assert file restored
        run: test -f data/db/git-fit.db
      - name: Save again (unchanged)
        id: save2
        uses: ./cache/save
        with:
          db-dir: data/db
          db-name: git-fit.db
      - name: Assert changed=false (gate)
        run: test "${{ steps.save2.outputs.changed }}" = "false"

  db-invalid-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Invalid db-name (leading dash) must fail
        id: name-dash
        continue-on-error: true
        uses: ./cache/save
        with:
          db-dir: data/db
          db-name: '-bad'
      - name: Assert invalid name failed
        run: test "${{ steps.name-dash.outcome }}" = "failure"
      - name: Invalid db-name (path traversal) must fail
        id: name-slash
        continue-on-error: true
        uses: ./cache/save
        with:
          db-dir: data/db
          db-name: '../etc/x.db'
      - name: Assert traversal rejected
        run: test "${{ steps.name-slash.outcome }}" = "failure"
      - name: Invalid db-dir (leading dash) must fail
        id: dir-dash
        continue-on-error: true
        uses: ./cache/save
        with:
          db-dir: '-bad'
          db-name: git-fit.db
      - name: Assert invalid dir failed
        run: test "${{ steps.dir-dash.outcome }}" = "failure"

  # Git branch restore/save tests build their fixture content at TEST TIME on a
  # throwaway branch pushed to a fake LOCAL origin (per-job bare repo), so no
  # fixture files are committed to the repository. The fake origin is real git:
  # the action's own git fetch/archive/worktree code paths run against it.
  db-git-restore-disabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore with default mode (none)
        id: restore
        uses: ./cache/restore
        with:
          db-dir: data/db
          db-name: never-here.db
      - name: Assert no git restore
        run: |
          test "${{ steps.restore.outputs.git-restored-bytes }}" = "0"
          test "${{ steps.restore.outputs.save-to-git-branch }}" = "false"

  db-git-restore-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up fake origin with fallback fixture
        run: |
          set -euo pipefail
          ORIG_BRANCH="$(git branch --show-current)"
          git remote remove origin
          git init -q --bare "$RUNNER_TEMP/fake-origin.git"
          git remote add origin "$RUNNER_TEMP/fake-origin.git"
          git checkout -q -b git-fit-fixtures
          mkdir -p test/fixtures/db
          printf 'fallback-fixture' > test/fixtures/db/git-restore.db
          git add -f test/fixtures/db/git-restore.db
          git -c user.name=test -c user.email=test commit -qm "test fixtures"
          git push -q origin git-fit-fixtures
          git checkout -q "$ORIG_BRANCH"
          rm -f test/fixtures/db/git-restore.db
      # File absent from both cache and workspace → fallback restores from the branch.
      - name: Restore from git branch on cache miss
        id: restore
        uses: ./cache/restore
        with:
          db-dir: test/fixtures/db
          db-name: git-restore.db
          git-restore-mode: fallback
          git-branch: git-fit-fixtures
      - name: Assert restored from git
        run: |
          test "${{ steps.restore.outputs.git-restored-bytes }}" -gt 0
          test "${{ steps.restore.outputs.save-to-git-branch }}" = "git-fit-fixtures"
          test "$(cat test/fixtures/db/git-restore.db)" = "fallback-fixture"

  db-git-restore-force:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up fake origin with force fixture
        run: |
          set -euo pipefail
          ORIG_BRANCH="$(git branch --show-current)"
          git remote remove origin
          git init -q --bare "$RUNNER_TEMP/fake-origin.git"
          git remote add origin "$RUNNER_TEMP/fake-origin.git"
          git checkout -q -b git-fit-fixtures
          mkdir -p data/db
          printf 'from-git' > data/db/git-fit.db
          git add -f data/db/git-fit.db
          git -c user.name=test -c user.email=test commit -qm "test fixtures"
          git push -q origin git-fit-fixtures
          git checkout -q "$ORIG_BRANCH"
          rm -f data/db/git-fit.db
      # Force always restores from git, overwriting whatever the cache provides.
      - name: Restore force (git overwrites cache)
        id: restore
        uses: ./cache/restore
        with:
          db-dir: data/db
          db-name: git-fit.db
          git-restore-mode: force
          git-branch: git-fit-fixtures
      - name: Assert git content wins
        run: |
          test "$(cat data/db/git-fit.db)" = "from-git"
          test "${{ steps.restore.outputs.git-restored-bytes }}" -gt 0
          test "${{ steps.restore.outputs.save-to-git-branch }}" = "git-fit-fixtures"

  db-git-restore-force-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Force with missing branch (GitFit/db absent here) — graceful
        id: restore
        uses: ./cache/restore
        with:
          db-dir: data/db
          db-name: never-here.db
          git-restore-mode: force
      - name: Assert graceful degradation
        run: |
          test "${{ steps.restore.outputs.git-restored-bytes }}" = "0"
          test "${{ steps.restore.outputs.save-to-git-branch }}" = "false"

  db-git-invalid-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Invalid git-restore-mode must fail
        id: invalid
        continue-on-error: true
        uses: ./cache/restore
        with:
          db-dir: data/db
          db-name: git-fit.db
          git-restore-mode: bogus
      - name: Assert invalid failed
        run: test "${{ steps.invalid.outcome }}" = "failure"

  db-save-git-unchanged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No restore: the baseline file is missing, so save reports changed=true
      # (documented baseline contract, same path exercised by db-smoke save1).
      # A fake origin branch holds a DB identical to the workspace DB; git-save
      # copies the workspace DB into that branch's worktree → no diff → unchanged.
      - name: Set up fake origin + workspace DB matching the branch
        run: |
          set -euo pipefail
          ORIG_BRANCH="$(git branch --show-current)"
          git remote remove origin
          git init -q --bare "$RUNNER_TEMP/fake-origin.git"
          git remote add origin "$RUNNER_TEMP/fake-origin.git"
          git checkout -q -b git-fit-fixtures
          mkdir -p data/db
          printf 'from-git' > data/db/git-fit.db
          git add -f data/db/git-fit.db
          git -c user.name=test -c user.email=test commit -qm "test fixtures"
          git push -q origin git-fit-fixtures
          git checkout -q "$ORIG_BRANCH"
      # workspace data/db/git-fit.db stays ('from-git', matches the branch).
      - name: Save (changed=true, DB equals branch fixture — worktree unchanged)
        id: save
        uses: ./cache/save
        with:
          db-dir: data/db
          db-name: git-fit.db
          save-to-git-branch: git-fit-fixtures
      - name: Assert worktree unchanged path (no push)
        run: |
          test "${{ steps.save.outputs.changed }}" = "true"
          test "${{ steps.save.outputs.git-save-status }}" = "unchanged"
